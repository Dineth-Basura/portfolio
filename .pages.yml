media:
  - name: images
    label: Portrait, project & certificate images
    input: public/images
    output: /images
    extensions:
      - png
      - jpg
      - jpeg
      - webp
      - avif
    rename: safe
  - name: documents
    label: CV documents
    input: public/cv
    output: /cv
    extensions:
      - pdf
    rename: false
content:
  - name: projects
    label: Projects & case studies
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - order
        - visible
      sort:
        - order
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - Cybersecurity
            - Full Stack
            - AI / Computer Vision
            - Other
      - name: description
        label: Description
        type: text
        required: true
      - name: technologies
        label: Technologies
        type: string
        list: true
      - name: date
        label: Date
        type: string
      - &a1
        name: order
        label: Order
        type: number
        default: 100
      - &a2
        name: visible
        label: Visible
        type: boolean
        default: true
      - name: featured
        label: Featured
        type: boolean
      - name: repository
        label: Repository
        type: string
        required: true
      - name: additionalRepositories
        label: Additional Repositories
        type: string
        list: true
      - name: demo
        label: Demo
        type: string
      - name: visual
        label: Visual
        type: select
        options:
          values:
            - network
            - plate
            - book
            - gym
            - password
            - tcp
            - generic
        default: generic
      - name: image
        label: Image
        type: image
        options:
          media: images
      - name: imageAlt
        label: Image Alt
        type: string
      - name: screenshots
        label: Screenshots
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
            required: true
            options:
              media: images
          - name: alt
            label: Alt
            type: string
            required: true
          - name: caption
            label: Caption
            type: string
      - name: body
        label: Body
        type: rich-text
      - name: imageType
        label: Cover image type
        type: select
        default: concept
        options:
          values:
            - concept
            - screenshot
  - name: certifications
    label: Certifications
    type: collection
    path: src/content/certifications
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - order
        - visible
      sort:
        - order
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: issuer
        label: Issuer
        type: string
        required: true
      - *a1
      - *a2
      - name: featured
        label: Featured
        type: boolean
      - name: date
        label: Date
        type: string
      - name: credentialId
        label: Credential Id
        type: string
      - name: credentialUrl
        label: Credential Url
        type: string
      - name: image
        label: Image
        type: image
        options:
          media: images
      - name: skills
        label: Skills
        type: string
        list: true
      - name: description
        label: Description
        type: text
      - name: body
        label: Body
        type: rich-text
  - name: experience
    label: Education, experience & activities
    type: collection
    path: src/content/experience
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - order
        - visible
      sort:
        - order
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: organization
        label: Organization
        type: string
        required: true
      - name: kind
        label: Kind
        type: select
        required: true
        options:
          values:
            - Education
            - Activity
            - Experience
      - name: period
        label: Period
        type: string
      - name: logo
        label: Institution logo
        type: image
        options:
          media: images
      - name: logoAlt
        label: Logo description
        type: string
      - name: description
        label: Description
        type: text
        required: true
      - *a1
      - *a2
      - name: body
        label: Body
        type: rich-text
  - name: profile
    label: Profile & social links
    type: file
    path: src/data/profile.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: fullName
        label: Full Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: status
        label: Status
        type: string
        required: true
      - name: headline
        label: Headline
        type: text
        required: true
      - name: intro
        label: Intro
        type: text
        required: true
      - name: typedIntro
        label: Typing introduction
        type: string
        required: true
      - name: bio
        label: Bio
        type: text
        required: true
      - name: aboutDetail
        label: About Detail
        type: text
        required: true
      - name: email
        label: Email
        type: string
        required: true
      - name: location
        label: Location
        type: string
        required: true
      - name: github
        label: Github
        type: string
        required: true
      - name: linkedin
        label: Linkedin
        type: string
        required: true
      - name: portrait
        label: Portrait
        type: image
        required: true
        options:
          media: images
      - name: portraitAlt
        label: Portrait Alt
        type: string
        required: true
      - name: orbitSkills
        label: Orbit Skills
        type: string
        list: true
        description: Use up to six portrait labels. Add other skills in the Skills editor.
  - name: skills
    label: Skills & categories
    type: file
    path: src/data/skills.json
    format: json
    fields:
      - name: stack
        label: Visual tech stack
        type: object
        list: true
        fields:
          - name: name
            label: Technology
            type: string
            required: true
          - name: icon
            label: Technology logo
            type: image
            required: true
            options:
              media: images
      - name: categories
        label: Categories
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: subtitle
            label: Subtitle
            type: string
            required: true
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - shield
                - code
                - layers
                - terminal
                - monitor
                - database
          - name: items
            label: Items
            type: string
            list: true
  - name: site
    label: Site settings & homepage copy
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: url
        label: Url
        type: string
        description: Final HTTPS site address. Leave empty until you deploy; then set
          this or the hosting SITE_URL variable.
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: cv
        label: Cv
        type: file
        required: true
        options:
          media: documents
      - name: socialImage
        label: Social Image
        type: image
        required: true
        options:
          media: images
      - name: introLabel
        label: Intro Label
        type: text
        required: true
      - name: aboutTitle
        label: About Title
        type: text
        required: true
      - name: skillsTitle
        label: Skills Title
        type: text
        required: true
      - name: projectsTitle
        label: Projects Title
        type: text
        required: true
      - name: projectsIntro
        label: Projects Intro
        type: text
        required: true
      - name: certificationsTitle
        label: Certifications Title
        type: text
        required: true
      - name: experienceTitle
        label: Experience Title
        type: text
        required: true
      - name: contactTitle
        label: Contact Title
        type: text
        required: true
      - name: contactIntro
        label: Contact Intro
        type: text
        required: true
      - name: showCertifications
        label: Show Certifications
        type: boolean
      - name: showExperience
        label: Show Experience
        type: boolean
      - name: navigation
        label: Navigation
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: id
            label: Id
            type: string
            required: true
  - name: contact
    label: Contact page & Web3Forms
    type: file
    path: src/data/contact.json
    format: json
    fields:
      - name: accessKey
        label: Access Key
        type: string
        required: true
        description: Public Web3Forms access key for your receiving email.
      - name: eyebrow
        label: Eyebrow
        type: string
        required: true
      - name: title
        label: Title
        type: text
        required: true
      - name: intro
        label: Intro
        type: text
        required: true
      - name: formTitle
        label: Form Title
        type: string
        required: true
      - name: formIntro
        label: Form Intro
        type: text
        required: true
      - name: nameLabel
        label: Name Label
        type: string
        required: true
      - name: emailLabel
        label: Email Label
        type: string
        required: true
      - name: subjectLabel
        label: Subject Label
        type: string
        required: true
      - name: messageLabel
        label: Message Label
        type: string
        required: true
      - name: submitLabel
        label: Submit Label
        type: string
        required: true
      - name: pendingLabel
        label: Pending Label
        type: string
        required: true
      - name: successMessage
        label: Success Message
        type: text
        required: true
      - name: errorMessage
        label: Error Message
        type: text
        required: true
      - name: privacyNote
        label: Privacy Note
        type: text
        required: true
      - name: defaultSubject
        label: Default Subject
        type: string
        required: true
      - name: homepageButton
        label: Homepage Button
        type: string
        required: true
